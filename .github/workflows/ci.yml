name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev,desktop]'
      - name: Desktop audio and interface regression without devices
        run: python tools/test_offline.py tests/test_duplex_audio.py tests/test_voice_playback.py tests/test_continuous_desktop_voice.py tests/test_desktop_voice.py -q
      - name: Desktop pet, art and interaction regression (offscreen)
        run: >-
          python tools/test_offline.py
          tests/test_desktop_pet.py
          tests/test_pet_brain.py
          tests/test_pet_brain_edges.py
          tests/test_pet_repertoire.py
          tests/test_pet_magic_purpose.py
          tests/test_pet_powered_flight.py
          tests/test_pet_air_play.py
          tests/test_pet_activity_endings.py
          tests/test_pet_ending_flow.py
          -q
  windows-launcher:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Windows entry point (no installation or bot startup)
        shell: cmd
        run: start.bat --help
      - name: Source launcher boundaries
        run: python -m unittest discover -s tests -p test_launcher.py
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - name: Offline regression suite (network denied)
        run: python tools/test_offline.py
      - name: First-run product smoke
        run: |
          regular --version
          regular demo 查好感 掷骰子
          regular --directory "$RUNNER_TEMP/regular-instance" init
          regular --directory "$RUNNER_TEMP/regular-instance" doctor --json > "$RUNNER_TEMP/doctor.json" || test "$?" -eq 1
          python -c 'import json, os; d=json.load(open(os.environ["RUNNER_TEMP"]+"/doctor.json")); assert d["network"] is False; assert any(x["check"] == "configuration" and x["state"] == "error" for x in d["checks"])'
      - run: python -m build
      - name: Installed wheel smoke from outside checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          regular --version
          regular demo 查好感 掷骰子
