<text x="923" y="147" font-size="18" font-weight="700" fill="#23324A">本地代码</text>
<text x="923" y="190" font-size="15" fill="#536782">检查场景、额度与权限</text>
<text x="923" y="222" font-size="15" fill="#536782">调用服务并发送实际结果</text>
