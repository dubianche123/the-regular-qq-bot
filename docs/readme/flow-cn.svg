<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1210" viewBox="0 0 1280 1210" role="img" aria-labelledby="flow-title flow-desc" xml:lang="zh-CN">
<title id="flow-title">线上接话，离线改进</title><desc id="flow-desc">代码选择路径并持有状态，判断与资料按需请求，回复模型可以接话或不接。慢任务先回应再跟进。原样输入、判断和实际送达进入离线体检、存例、代码或提示词修改及新旧回放，维护者批准后才发布。</desc>
