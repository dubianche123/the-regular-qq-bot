<text x="53" y="190" font-size="15" fill="#536782">群友说了什么</text>
<text x="53" y="222" font-size="15" fill="#536782">最近的对话、图片或语音</text>
<rect x="326" y="110" width="258" height="156" rx="14" fill="#E7F5EF" stroke="#93C8B0"/>
<text x="343" y="147" font-size="18" font-weight="700" fill="#23324A">规则 · 按需判断与查询</text>
<text x="343" y="190" font-size="15" fill="#536782">部分消息使用闭集判断</text>
<text x="343" y="222" font-size="15" fill="#536782">需要时查群记忆或联网</text>
<rect x="616" y="110" width="258" height="156" rx="14" fill="#F0EAFC" stroke="#B7A2D7"/>
<text x="633" y="147" font-size="18" font-weight="700" fill="#23324A">对话模型</text>
<text x="633" y="190" font-size="15" fill="#536782">未点名时决定接话与否</text>
<text x="633" y="222" font-size="15" fill="#536782">组织回复，可提出画图或语音</text>
