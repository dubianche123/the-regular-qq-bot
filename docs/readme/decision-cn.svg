<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="decisions-title decisions-desc" xml:lang="zh-CN">
  <title id="decisions-title">让判断成为选择题</title>
  <desc id="decisions-desc">本地代码针对相关群消息选择适用问题，可合并提交到 OpenAI Decisions。接口返回固定选项与分数，本地代码结合规则和额度采用结果或回退；按需取得的资料进入本轮上下文，再由对话模型组织回复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" markerWidth="8" markerHeight="8" refX="9" refY="5" orient="auto-start-reverse"><path d="M2 1L7 5L2 9" fill="none" stroke="#8794A6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="1" y="1" width="1278" height="788" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
    <text x="48" y="56" font-size="16" fill="#B78749" font-weight="700" text-anchor="start" letter-spacing="1.7">THE REGULAR / DECISIONS</text>
    <text x="48" y="110" font-size="32" fill="#213249" font-weight="700" text-anchor="start">让判断成为选择题</text>
    <text x="48" y="148" font-size="21" fill="#56677E" font-weight="400" text-anchor="start">适用题目合并提交，选择结果交回本地代码。</text>
    <rect x="48" y="184" width="1184" height="76" rx="16" fill="white" stroke="#D7E0EB"/>
    <g transform="translate(72 205)" fill="none" stroke="#56677E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h30v22H15l-8 8v-8H2z"/><path d="M9 10h16M9 16h11"/></g>
    <text x="124" y="230" font-size="22" fill="#213249" font-weight="600" text-anchor="start">「小王，上次那家店还开着吗？」</text>
    <text x="1208" y="230" font-size="18" fill="#56677E" font-weight="400" text-anchor="end">消息 + 最近聊天</text>
    <path d="M224 260v28" fill="none" stroke="#8794A6" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="300" width="352" height="270" rx="18" fill="#FFF4E4" stroke="#E6D6BE"/>
    <rect x="464" y="300" width="352" height="270" rx="18" fill="#EAF4EF" stroke="#BCD5CA"/>
    <rect x="880" y="300" width="352" height="270" rx="18" fill="#FFF4E4" stroke="#E6D6BE"/>
    <text x="72" y="334" font-size="16" fill="#B78749" font-weight="700" text-anchor="start" letter-spacing=".7">01 / 本地代码</text>
    <text x="488" y="334" font-size="16" fill="#397D70" font-weight="700" text-anchor="start" letter-spacing=".7">02 / 闭集判断</text>
    <text x="904" y="334" font-size="16" fill="#B78749" font-weight="700" text-anchor="start" letter-spacing=".7">03 / 本地代码</text>
    <text x="72" y="376" font-size="26" fill="#213249" font-weight="700" text-anchor="start">按场景选题</text>
    <text x="488" y="376" font-size="25" fill="#213249" font-weight="700" text-anchor="start">OpenAI Decisions</text>
    <text x="904" y="376" font-size="25" fill="#213249" font-weight="700" text-anchor="start">采用结果，或回退</text>
    <circle cx="77" cy="410" r="3" fill="#B78749"/>
    <text x="90" y="416" font-size="20" fill="#213249" font-weight="400" text-anchor="start">是在跟我说话吗？</text>
    <circle cx="77" cy="444" r="3" fill="#B78749"/>
    <text x="90" y="450" font-size="20" fill="#213249" font-weight="400" text-anchor="start">需要翻群里的旧事吗？</text>
    <circle cx="77" cy="478" r="3" fill="#B78749"/>
    <text x="90" y="484" font-size="20" fill="#213249" font-weight="400" text-anchor="start">需要查最新信息吗？</text>
    <text x="72" y="544" font-size="18" fill="#56677E" font-weight="400" text-anchor="start">只问适用题目 · 可合并提交</text>
    <text x="488" y="416" font-size="20" fill="#213249" font-weight="400" text-anchor="start">从固定选项中选择</text>
    <rect x="488" y="438" width="304" height="89" rx="12" fill="white" stroke="#C5DACE"/>
    <text x="508" y="471" font-size="22" fill="#397D70" font-weight="700" text-anchor="start">选择 + 分数</text>
    <text x="508" y="503" font-size="17" fill="#56677E" font-weight="400" text-anchor="start">比较选项，不当作校准概率</text>
    <text x="904" y="416" font-size="20" fill="#213249" font-weight="400" text-anchor="start">结合本地规则与额度</text>
    <text x="904" y="450" font-size="20" fill="#213249" font-weight="400" text-anchor="start">决定接话、查找或回退</text>
    <text x="904" y="544" font-size="18" fill="#56677E" font-weight="400" text-anchor="start">状态与执行由代码掌握</text>
    <path d="M406 435h46" fill="none" stroke="#8794A6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M822 435h46" fill="none" stroke="#8794A6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="432" y="412" font-size="17" fill="#56677E" font-weight="400" text-anchor="middle">提交</text>
    <text x="848" y="412" font-size="17" fill="#56677E" font-weight="400" text-anchor="middle">返回</text>
    <path d="M1056 570v20H224v14" fill="none" stroke="#8794A6" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
    <rect x="48" y="610" width="1184" height="108" rx="18" fill="white" stroke="#D7E0EB"/>
    <rect x="48" y="630" width="4" height="68" rx="2" fill="#397D70"/>
    <text x="76" y="652" font-size="22" fill="#397D70" font-weight="700" text-anchor="start">按需查资料</text>
    <text x="76" y="687" font-size="18" fill="#56677E" font-weight="400" text-anchor="start">由代码执行查询或搜索</text>
    <text x="488" y="652" font-size="22" fill="#213249" font-weight="600" text-anchor="start">资料进入本轮上下文</text>
    <text x="488" y="687" font-size="18" fill="#56677E" font-weight="400" text-anchor="start">只作为这一轮的参考证据</text>
    <text x="910" y="652" font-size="22" fill="#7962A7" font-weight="700" text-anchor="start">对话模型组织回复</text>
    <text x="910" y="687" font-size="18" fill="#56677E" font-weight="400" text-anchor="start">结合资料，自然接话</text>
    <path d="M406 664h46" fill="none" stroke="#8794A6" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M822 664h46" fill="none" stroke="#8794A6" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="48" y="760" font-size="18" fill="#56677E" font-weight="400" text-anchor="start">示意流程：不是每条消息都要分诊，也不是每轮都需要查询。</text>
  </g>
</svg>
