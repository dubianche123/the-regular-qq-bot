<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">一条群消息，Decisions 怎么用？</title>
<desc id="desc">一条与机器人相关的群消息和上下文，根据场景将适用的闭集问题提交到 OpenAI Decisions，返回选择和分数，本地代码结合规则和额度执行或回退。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#8595A9"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<rect x="1" y="1" width="1198" height="658" rx="20" fill="#F8FAFD" stroke="#DBE3ED"/>
<text x="36" y="48" font-size="25" fill="#23324A" font-weight="700">一条群消息，Decisions 怎么用？</text>
<text x="36" y="79" font-size="16" fill="#536782" font-weight="400">先把适用的判断题放在一起，再由本地代码决定怎么做。</text>
<rect x="36" y="120" width="248" height="218" rx="14" fill="#EAF1FE" stroke="#9CB4DF"/>
<text x="54" y="156" font-size="18" fill="#23324A" font-weight="700">群消息与上下文</text>
<rect x="53" y="179" width="214" height="97" rx="10" fill="#FFFFFF" stroke="#D6E0EE"/>
<text x="66" y="211" font-size="15" fill="#334766" font-weight="600">「小王，上次说的那家店</text>
<text x="66" y="237" font-size="15" fill="#334766" font-weight="600">现在还开着吗？」</text>
<text x="54" y="310" font-size="14" fill="#536782" font-weight="400">结合之前聊过的内容</text>
<path d="M284 229H316" fill="none" stroke="#8595A9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="324" y="120" width="438" height="336" rx="14" fill="#E7F5EF" stroke="#93C8B0"/>
<text x="344" y="156" font-size="18" fill="#23324A" font-weight="700">按场景选题，一次提交</text>
<rect x="343" y="176" width="400" height="71" rx="9" fill="#FFFFFF" stroke="#CFE5DA"/>
<text x="359" y="202" font-size="16" fill="#23324A" font-weight="700">是在跟我说话吗？</text>
<text x="359" y="227" font-size="14" fill="#536782" font-weight="400">回答 · 逗趣 · 顺口提及</text>
<rect x="343" y="261" width="400" height="71" rx="9" fill="#FFFFFF" stroke="#CFE5DA"/>
<text x="359" y="287" font-size="16" fill="#23324A" font-weight="700">需要翻群里的旧事吗？</text>
<text x="359" y="312" font-size="14" fill="#536782" font-weight="400">查找 · 不需要</text>
<rect x="343" y="346" width="400" height="71" rx="9" fill="#FFFFFF" stroke="#CFE5DA"/>
<text x="359" y="372" font-size="16" fill="#23324A" font-weight="700">需要查最新信息吗？</text>
<text x="359" y="397" font-size="14" fill="#536782" font-weight="400">联网查询 · 深入研究 · 不查</text>
<path d="M762 229H795" fill="none" stroke="#8595A9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="803" y="120" width="361" height="145" rx="14" fill="#F0EAFC" stroke="#B7A2D7"/>
<text x="823" y="156" font-size="18" fill="#23324A" font-weight="700">选项与把握程度</text>
<text x="823" y="195" font-size="15" fill="#536782" font-weight="400">为每道题返回选择和分数</text>
<text x="823" y="225" font-size="15" fill="#536782" font-weight="400">不确定的题不强行采用</text>
<path d="M983 265V285" fill="none" stroke="#8595A9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="803" y="293" width="361" height="163" rx="14" fill="#FFF3DD" stroke="#D9BD83"/>
<text x="823" y="330" font-size="18" fill="#23324A" font-weight="700">本地代码</text>
<text x="823" y="370" font-size="15" fill="#536782" font-weight="400">结合规则、额度与判断结果</text>
<text x="823" y="401" font-size="15" fill="#536782" font-weight="400">决定接话、查找或采用回退方式</text>
<path d="M983 456V482" fill="none" stroke="#8595A9" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="36" y="490" width="1128" height="96" rx="14" fill="#FFFFFF" stroke="#CCD8E4"/>
<text x="54" y="530" font-size="16" fill="#23324A" font-weight="700">可能：查旧事或联网</text>
<text x="424" y="530" font-size="16" fill="#23324A" font-weight="700">资料进入本轮上下文</text>
<text x="808" y="530" font-size="16" fill="#23324A" font-weight="700">对话模型自然接话</text>
<path d="M345 526H390" fill="none" stroke="#8595A9" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M728 526H773" fill="none" stroke="#8595A9" stroke-width="2" marker-end="url(#arrow)"/>
<text x="36" y="627" font-size="14" fill="#536782" font-weight="400">示意：只有适用的题才会提问；实际选择和执行结果取决于上下文与配置。</text>
</g></svg>
