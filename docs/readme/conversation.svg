<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">A little life in the group chat</title>
<desc id="desc">Three illustrative conversations: a member splits a request and the bot’s name across two messages; another member corrects a shop name; a member asks the bot to draw a cat. Illustrative examples; actual replies depend on context and service availability.</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1198" height="548" rx="20" fill="#F8FAFD" stroke="#DBE3ED"/>
<text x="36" y="49" font-size="25" fill="#23324A" font-weight="700">A little life in the group chat</text><text x="36" y="79" font-size="15" fill="#647691" font-weight="400">Illustrative examples; actual replies depend on context and service availability.</text><rect x="36" y="111" width="344" height="345" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/><text x="54" y="148" font-size="17" fill="#344963" font-weight="700">01  A thought in two messages</text><path d="M54 163H362" stroke="#E7EDF4"/><rect x="428" y="111" width="344" height="345" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/><text x="446" y="148" font-size="17" fill="#344963" font-weight="700">02  Picking up a correction</text><path d="M446 163H754" stroke="#E7EDF4"/><rect x="820" y="111" width="344" height="345" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/><text x="838" y="148" font-size="17" fill="#344963" font-weight="700">03  Drawing together</text><path d="M838 163H1146" stroke="#E7EDF4"/><text x="54" y="192" font-size="13" fill="#71819A" font-weight="600">Member</text><rect x="54" y="202" width="235" height="40" rx="13" fill="#EAF0F8"/><text x="68" y="227.0" font-size="15" fill="#273A51" font-weight="500">Tell me the story?</text><rect x="54" y="250" width="125" height="39" rx="13" fill="#EAF0F8"/><text x="68" y="274.5" font-size="15" fill="#273A51" font-weight="500">Xiaowang</text><text x="69" y="320" font-size="13" fill="#71819A" font-weight="600">The Regular</text><rect x="69" y="330" width="287" height="47" rx="13" fill="#EBD0AA"/><text x="83" y="358.5" font-size="15" fill="#273A51" font-weight="500">Sure, let’s start at the beginning.</text><text x="446" y="192" font-size="13" fill="#71819A" font-weight="600">The Regular</text><rect x="446" y="202" width="280" height="40" rx="13" fill="#EBD0AA"/><text x="460" y="227.0" font-size="15" fill="#273A51" font-weight="500">Was that shop called Blue Tree?</text><text x="446" y="272" font-size="13" fill="#71819A" font-weight="600">Another member</text><rect x="446" y="282" width="228" height="40" rx="13" fill="#EAF0F8"/><text x="460" y="307.0" font-size="15" fill="#273A51" font-weight="500">It was Green Leaf.</text><text x="446" y="352" font-size="13" fill="#71819A" font-weight="600">The Regular</text><rect x="446" y="362" width="245" height="40" rx="13" fill="#EBD0AA"/><text x="460" y="387.0" font-size="15" fill="#273A51" font-weight="500">Right, Green Leaf!</text><text x="838" y="192" font-size="13" fill="#71819A" font-weight="600">Member</text><rect x="838" y="202" width="300" height="40" rx="13" fill="#EAF0F8"/><text x="852" y="227.0" font-size="15" fill="#273A51" font-weight="500">Xiaowang, draw a cat in a hat.</text><text x="838" y="272" font-size="13" fill="#71819A" font-weight="600">The Regular</text><rect x="838" y="282" width="278" height="40" rx="13" fill="#EBD0AA"/><text x="852" y="307.0" font-size="15" fill="#273A51" font-weight="500">Sure, I’ll give it a little hat.</text><rect x="838" y="337" width="300" height="93" rx="13" fill="#E5F1EE"/>
<circle cx="896" cy="386" r="24" fill="#E2B281"/>
