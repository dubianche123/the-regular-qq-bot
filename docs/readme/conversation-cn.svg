<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">在群里，像这样自然地聊</title>
<desc id="desc">三组示意对话：同一群友分两条提问并喊小团团；另一位群友纠正店名；群友自然地请小团团画一只猫。 以下为示意对话；实际回应会因上下文与服务状态而不同。</desc>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1198" height="548" rx="20" fill="#F8FAFD" stroke="#DBE3ED"/>
<text x="36" y="49" font-size="25" fill="#23324A" font-weight="700">在群里，像这样自然地聊</text><text x="36" y="79" font-size="15" fill="#647691" font-weight="400">以下为示意对话；实际回应会因上下文与服务状态而不同。</text><rect x="36" y="111" width="344" height="345" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/><text x="54" y="148" font-size="17" fill="#344963" font-weight="700">01  连着说的话</text><path d="M54 163H362" stroke="#E7EDF4"/><rect x="428" y="111" width="344" height="345" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/><text x="446" y="148" font-size="17" fill="#344963" font-weight="700">02  接住补充</text><path d="M446 163H754" stroke="#E7EDF4"/><rect x="820" y="111" width="344" height="345" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/><text x="838" y="148" font-size="17" fill="#344963" font-weight="700">03  一起画张图</text><path d="M838 163H1146" stroke="#E7EDF4"/><text x="54" y="192" font-size="13" fill="#71819A" font-weight="600">群友</text><rect x="54" y="202" width="235" height="40" rx="13" fill="#EAF0F8"/><text x="68" y="227.0" font-size="15" fill="#273A51" font-weight="500">讲讲这个故事？</text><rect x="54" y="250" width="125" height="39" rx="13" fill="#EAF0F8"/><text x="68" y="274.5" font-size="15" fill="#273A51" font-weight="500">小团团</text><text x="69" y="320" font-size="13" fill="#71819A" font-weight="600">小团团</text><rect x="69" y="330" width="287" height="47" rx="13" fill="#EBD0AA"/><text x="83" y="358.5" font-size="15" fill="#273A51" font-weight="500">好，我从头讲起。</text><text x="446" y="192" font-size="13" fill="#71819A" font-weight="600">小团团</text><rect x="446" y="202" width="280" height="40" rx="13" fill="#EBD0AA"/><text x="460" y="227.0" font-size="15" fill="#273A51" font-weight="500">那家店好像叫青树？</text><text x="446" y="272" font-size="13" fill="#71819A" font-weight="600">另一位群友</text><rect x="446" y="282" width="228" height="40" rx="13" fill="#EAF0F8"/><text x="460" y="307.0" font-size="15" fill="#273A51" font-weight="500">是青禾啦。</text><text x="446" y="352" font-size="13" fill="#71819A" font-weight="600">小团团</text><rect x="446" y="362" width="245" height="40" rx="13" fill="#EBD0AA"/><text x="460" y="387.0" font-size="15" fill="#273A51" font-weight="500">哦对，是青禾。</text><text x="838" y="192" font-size="13" fill="#71819A" font-weight="600">群友</text><rect x="838" y="202" width="300" height="40" rx="13" fill="#EAF0F8"/><text x="852" y="227.0" font-size="15" fill="#273A51" font-weight="500">小团团，画只戴帽子的猫。</text><text x="838" y="272" font-size="13" fill="#71819A" font-weight="600">小团团</text><rect x="838" y="282" width="278" height="40" rx="13" fill="#EBD0AA"/><text x="852" y="307.0" font-size="15" fill="#273A51" font-weight="500">好，给它画顶小帽子。</text><rect x="838" y="337" width="300" height="93" rx="13" fill="#E5F1EE"/>
<circle cx="896" cy="386" r="24" fill="#E2B281"/>
<path d="M878 373l3-15 12 8M914 373l-3-15-12 8" fill="#D89E6C" stroke="#9E7259" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M880 367h31M886 366l4-12h12l5 12" fill="#74889D" stroke="#5E7086" stroke-width="1.5" stroke-linejoin="round"/>
<circle cx="889" cy="386" r="2" fill="#5A4B48"/><circle cx="903" cy="386" r="2" fill="#5A4B48"/>
<path d="M893 393q3 3 6 0M873 391l8 1m-8 4 8-1m29-3 8-1m-8 4 8 1" fill="none" stroke="#765A51" stroke-width="1.5" stroke-linecap="round"/><text x="944" y="391" font-size="14" fill="#637D77" font-weight="600">图片示意</text><text x="36" y="508" font-size="15" fill="#677A93" font-weight="400">看懂上下文  ·  理解群友反馈  ·  按需调用能力（受配置和额度约束）</text></g></svg>
