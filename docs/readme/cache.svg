<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="cache-title cache-desc" xml:lang="en">
<title id="cache-title">75.6% of input tokens came from cache</title><desc id="cache-desc">Of input tokens in 261 reply calls over one live day, 75.6% were served from the prefix cache and 24.4% were not. The bar shows shares of input tokens, not shares of calls.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1278" height="398" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
<text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1.7">THE REGULAR / PREFIX CACHE</text>
<text x="48" y="98" font-size="32" fill="#213249" font-weight="700">75.6% of input tokens came from cache</text>
<text x="48" y="137" font-size="21" fill="#56677E" font-weight="400">Input-token share · 261 reply calls in one live day</text>
<text x="48" y="229" font-size="64" fill="#397D70" font-weight="700">75.6%</text>
<text x="287" y="219" font-size="23" fill="#213249" font-weight="600">Cached prefix</text>
<text x="1232" y="225" font-size="43" fill="#56677E" font-weight="700" text-anchor="end">24.4%</text>
<rect x="48" y="258" width="1184" height="34" rx="10" fill="#DCE4EE" stroke="#DCE4EE"/>
<clipPath id="bar-clip"><rect x="48" y="258" width="1184" height="34" rx="10"/></clipPath>
<rect x="48" y="258" width="895.104" height="34" fill="#397D70" clip-path="url(#bar-clip)"/>
<text x="48" y="333" font-size="19" fill="#397D70" font-weight="600">Served from prefix cache</text>
<text x="1232" y="333" font-size="19" fill="#56677E" font-weight="600" text-anchor="end">Not cached</text>
<text x="48" y="373" font-size="18" fill="#56677E" font-weight="400">Measured input-token share, not the fraction of calls with a cache hit.</text>
</g></svg>
