<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="966" viewBox="0 0 1280 966" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="en">
  <title id="diagram-title">The model chooses. Code carries it out.</title>
  <desc id="diagram-desc">One reply is parsed by expression.parse. Pass sends nothing; draw sends the line then creates an image with quotas, moderation and refunds for confirmed unsent images; voice is synthesized and checked by transcription, with a text fallback; reminders register one job per member and echo the time; ordinary replies send text. Code records actual executed outcomes in the session.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="1" y="1" width="1278" height="964" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
    <text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1.7">THE REGULAR / EXPRESSION</text>
    <text x="48" y="101" font-size="32" fill="#213249" font-weight="700" >The model chooses. Code carries it out.</text>
    <text x="48" y="140" font-size="21" fill="#56677E" font-weight="400" >One reply carries both the words and the intended action.</text>
    <rect x="48" y="178" width="520" height="76" rx="16" fill="#F0EBF8" stroke="#D6CCE7"/>
    <text x="72" y="224" font-size="24" fill="#7962A7" font-weight="650" >Reply text + optional action tag</text>
    <path d="M578 216h98" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="688" y="178" width="544" height="76" rx="16" fill="#FFF4E4" stroke="#E6D6BE"/>
    <text x="712" y="224" font-size="24" fill="#A7783E" font-weight="650" >expression.parse → local execution</text>
    <text x="72" y="291" font-size="16" fill="#7962A7" font-weight="700" letter-spacing="1">MODEL OUTPUT</text>
    <text x="474" y="291" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1">WHAT CODE DOES</text>
    <rect x="48" y="310" width="1184" height="78" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="324" width="350" height="50" rx="10" fill="#EAF0F6" stroke="#EAF0F6"/>
    <text x="82" y="357" font-size="20" fill="#56677E" font-weight="650" >〔不接〕</text>
    <path d="M428 349.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="357" font-size="20" fill="#213249" font-weight="600" >Send nothing</text>
    <rect x="48" y="404" width="1184" height="96" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="418" width="350" height="68" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
    <text x="82" y="452" font-size="20" fill="#A7783E" font-weight="650" >〔画〕 + brief</text>
    <path d="M428 452.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="443" font-size="20" fill="#213249" font-weight="600" >Send the line, then generate and deliver the image</text>
    <text x="480" y="476" font-size="18" fill="#56677E" font-weight="400" >Quotas · moderation · refund confirmed unsent images</text>
    <rect x="48" y="516" width="1184" height="96" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="530" width="350" height="68" rx="10" fill="#F0EBF8" stroke="#F0EBF8"/>
    <text x="82" y="564" font-size="20" fill="#7962A7" font-weight="650" >〔语音〕 + tone</text>
    <path d="M428 564.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="555" font-size="20" fill="#213249" font-weight="600" >Synthesize → transcribe back → compare → deliver</text>
    <text x="480" y="588" font-size="18" fill="#56677E" font-weight="400" >Mismatch: send the same words as text</text>
    <rect x="48" y="628" width="1184" height="96" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="642" width="350" height="68" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
    <text x="82" y="676" font-size="20" fill="#A7783E" font-weight="650" >〔提醒 11-03 09:00〕</text>
    <path d="M428 676.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="667" font-size="20" fill="#213249" font-weight="600" >Register one reminder per member</text>
    <text x="480" y="700" font-size="18" fill="#56677E" font-weight="400" >Echo the time: (registered: 11-03 09:00)</text>
    <rect x="48" y="740" width="1184" height="78" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="754" width="350" height="50" rx="10" fill="#EAF0F6" stroke="#EAF0F6"/>
    <text x="82" y="787" font-size="20" fill="#56677E" font-weight="650" >No tag</text>
    <path d="M428 779.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="787" font-size="20" fill="#213249" font-weight="600" >Send text</text>
    <rect x="48" y="854" width="1184" height="76" rx="16" fill="#EAF4EF" stroke="#C9DFD5"/>
    <text x="72" y="885" font-size="16" fill="#397D70" font-weight="700" letter-spacing="1">AFTER EXECUTION</text>
    <text x="276" y="900" font-size="22" fill="#397D70" font-weight="600" >Code records the actual outcome in the session.</text>
  </g>
</svg>
