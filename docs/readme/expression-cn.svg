<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="966" viewBox="0 0 1280 966" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="zh-CN">
  <title id="diagram-title">模型表达意图，代码兑现动作</title>
  <desc id="diagram-desc">expression.parse 解析一条回复中的标记。不接则整条不发；画图先发文字再生图并检查额度审核、确定未发送退次数；语音合成后转写核对，不符改发同一句文字；提醒登记为一人一条并回执时间；无标记发文字。已执行动作的实际结果由代码写回会话。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="1" y="1" width="1278" height="964" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
    <text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1.7">THE REGULAR / EXPRESSION</text>
    <text x="48" y="101" font-size="32" fill="#213249" font-weight="700" >模型表达意图，代码兑现动作</text>
    <text x="48" y="140" font-size="21" fill="#56677E" font-weight="400" >同一条回复里写出要说的话，也写出打算做的事。</text>
    <rect x="48" y="178" width="520" height="76" rx="16" fill="#F0EBF8" stroke="#D6CCE7"/>
    <text x="72" y="224" font-size="24" fill="#7962A7" font-weight="650" >回复正文 ＋ 可选动作标记</text>
    <path d="M578 216h98" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="688" y="178" width="544" height="76" rx="16" fill="#FFF4E4" stroke="#E6D6BE"/>
    <text x="712" y="224" font-size="24" fill="#A7783E" font-weight="650" >expression.parse → 本地执行</text>
    <text x="72" y="291" font-size="16" fill="#7962A7" font-weight="700" letter-spacing="1">模型输出</text>
    <text x="474" y="291" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1">代码执行</text>
    <rect x="48" y="310" width="1184" height="78" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="324" width="350" height="50" rx="10" fill="#EAF0F6" stroke="#EAF0F6"/>
    <text x="82" y="357" font-size="21" fill="#56677E" font-weight="650" >〔不接〕</text>
    <path d="M428 349.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="357" font-size="22" fill="#213249" font-weight="600" >整条不发送</text>
    <rect x="48" y="404" width="1184" height="96" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="418" width="350" height="68" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
    <text x="82" y="452" font-size="21" fill="#A7783E" font-weight="650" >〔画〕＋画面描述</text>
    <path d="M428 452.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="443" font-size="22" fill="#213249" font-weight="600" >先发那句话，再生成并送图</text>
    <text x="480" y="476" font-size="20" fill="#56677E" font-weight="400" >个人 / 全局额度 · 图片审核 · 确认没发出退次数</text>
    <rect x="48" y="516" width="1184" height="96" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="530" width="350" height="68" rx="10" fill="#F0EBF8" stroke="#F0EBF8"/>
    <text x="82" y="564" font-size="21" fill="#7962A7" font-weight="650" >〔语音〕（声气）</text>
    <path d="M428 564.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="555" font-size="22" fill="#213249" font-weight="600" >合成 → 转写回读核对 → 送达</text>
    <text x="480" y="588" font-size="20" fill="#56677E" font-weight="400" >对不上时，把原本那句话改发文字</text>
    <rect x="48" y="628" width="1184" height="96" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="642" width="350" height="68" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
    <text x="82" y="676" font-size="21" fill="#A7783E" font-weight="650" >〔提醒 11-03 09:00〕</text>
    <path d="M428 676.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="667" font-size="22" fill="#213249" font-weight="600" >登记定时任务：每人一条，新的顶掉旧的</text>
    <text x="480" y="700" font-size="20" fill="#56677E" font-weight="400" >回执报出时间：（记下了：11-03 09:00）</text>
    <rect x="48" y="740" width="1184" height="78" rx="16" fill="white" stroke="#D7E0EB"/>
    <rect x="64" y="754" width="350" height="50" rx="10" fill="#EAF0F6" stroke="#EAF0F6"/>
    <text x="82" y="787" font-size="21" fill="#56677E" font-weight="650" >没有标记</text>
    <path d="M428 779.0h30" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="480" y="787" font-size="22" fill="#213249" font-weight="600" >发送文字</text>
    <rect x="48" y="854" width="1184" height="76" rx="16" fill="#EAF4EF" stroke="#C9DFD5"/>
    <text x="72" y="885" font-size="16" fill="#397D70" font-weight="700" letter-spacing="1">执行之后</text>
    <text x="276" y="900" font-size="22" fill="#397D70" font-weight="600" >代码把实际送达或失败写回会话，下一轮能看见。</text>
  </g>
</svg>
