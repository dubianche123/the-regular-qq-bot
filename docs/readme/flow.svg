<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">From group messages to responses</title>
<desc id="desc">Group messages and context pass through local rules and, when needed, closed-choice decisions and lookup. The chat model chooses whether to respond and may request an image or voice reply; code checks and carries out permitted actions. The result can be silence, text, an image or voice. Local code manages relationships, memory and quotas.</desc>
