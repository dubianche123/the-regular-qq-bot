<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1210" viewBox="0 0 1280 1210" role="img" aria-labelledby="flow-title flow-desc" xml:lang="en">
<title id="flow-title">Live replies and offline improvement</title><desc id="flow-desc">Local code selects the route and owns state. Judgments and evidence are optional; the reply model may answer or stay quiet. Slow work can acknowledge first and follow up later. Original inputs, judgments and actual outcomes feed offline checkup, cases, code or prompt edits and old/new replay. A maintainer approves release.</desc>
