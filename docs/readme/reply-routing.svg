<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="en">
  <title id="diagram-title">When does it join the conversation?</title>
  <desc id="diagram-desc">An explicit platform mention takes the answer path. A name mention is judged by addressed: answer, quip or let_it_pass. An unaddressed message or let_it_pass passes local quiet-window, stop and unread-image rules first, and is queued one call at a time per group. The reply model then sees its own recent lines and chooses to reply or write 〔不接〕.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="1" y="1" width="1278" height="1008" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
    <text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1.7">THE REGULAR / REPLY ROUTING</text>
    <text x="48" y="101" font-size="32" fill="#213249" font-weight="700" >When does it join the conversation?</text>
    <text x="48" y="140" font-size="21" fill="#56677E" font-weight="400" >Addressed messages and unaddressed chat take different paths.</text>
    <rect x="48" y="178" width="1184" height="68" rx="16" fill="#213249" stroke="#213249"/>
    <text x="72" y="221" font-size="24" fill="#FFFFFF" font-weight="600" >A new group message</text>
    <rect x="48" y="280" width="1184" height="100" rx="18" fill="#FFF4E4" stroke="#E6D6BE"/>
    <text x="72" y="321" font-size="16" fill="#A7783E" font-weight="700" >01 / @ MENTION</text>
    <text x="72" y="355" font-size="23" fill="#213249" font-weight="650" >Explicitly addressed</text>
    <path d="M344 330h114" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="488" y="340" font-size="25" fill="#213249" font-weight="650" >Take the answer path</text>
    <text x="904" y="340" font-size="20" fill="#A7783E" font-weight="600" >Answer the message</text>
    <rect x="48" y="404" width="1184" height="200" rx="18" fill="white" stroke="#D7E0EB"/>
    <text x="72" y="446" font-size="16" fill="#A7783E" font-weight="700" >02 / NAME MENTION</text>
    <text x="72" y="480" font-size="24" fill="#213249" font-weight="650" >Decisions</text>
    <text x="72" y="516" font-size="22" fill="#397D70" font-weight="650" >addressed</text>
    <path d="M294 502h44" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="358" y="446" width="274" height="126" rx="14" fill="#EAF4EF" stroke="#EAF4EF"/>
    <text x="378" y="487" font-size="22" fill="#397D70" font-weight="650" >answer</text>
    <text x="378" y="536" font-size="20" fill="#213249" font-weight="600" >Answer properly</text>
    <rect x="646" y="446" width="274" height="126" rx="14" fill="#FFF4E4" stroke="#FFF4E4"/>
    <text x="666" y="487" font-size="22" fill="#A7783E" font-weight="650" >quip</text>
    <text x="666" y="536" font-size="20" fill="#213249" font-weight="600" >One short line</text>
    <rect x="934" y="446" width="274" height="126" rx="14" fill="#F0EBF8" stroke="#F0EBF8"/>
    <text x="954" y="487" font-size="22" fill="#7962A7" font-weight="650" >let_it_pass</text>
    <text x="954" y="536" font-size="20" fill="#213249" font-weight="600" >Use the flow below</text>
    <text x="48" y="655" font-size="17" fill="#7962A7" font-weight="700" >03 / UNADDRESSED OR let_it_pass</text>
    <rect x="48" y="686" width="560" height="230" rx="18" fill="#FFF4E4" stroke="#E6D6BE"/>
    <text x="72" y="728" font-size="24" fill="#213249" font-weight="650" >Local safeguards apply first</text>
    <text x="72" y="771" font-size="19" fill="#56677E" font-weight="400" >Quiet window · stop request</text>
    <text x="72" y="805" font-size="19" fill="#56677E" font-weight="400" >Unread image with no text</text>
    <text x="72" y="839" font-size="19" fill="#56677E" font-weight="400" >Blocked → do not call the reply model</text>
    <text x="72" y="873" font-size="19" fill="#56677E" font-weight="400" >Passed → one queued call per group</text>
    <path d="M618 800h42" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="672" y="686" width="560" height="230" rx="18" fill="#F0EBF8" stroke="#D6CCE7"/>
    <text x="696" y="728" font-size="24" fill="#213249" font-weight="650" >Then the model chooses</text>
    <text x="696" y="774" font-size="21" fill="#56677E" font-weight="400" >With its own recent lines in view</text>
    <text x="696" y="807" font-size="21" fill="#56677E" font-weight="400" >and the surrounding group conversation</text>
    <rect x="696" y="840" width="192" height="48" rx="12" fill="white" stroke="white"/>
    <text x="792.0" y="872" font-size="20" fill="#7962A7" font-weight="600" text-anchor="middle">Reply</text>
    <rect x="908" y="840" width="300" height="48" rx="12" fill="white" stroke="white"/>
    <text x="1058.0" y="872" font-size="20" fill="#7962A7" font-weight="600" text-anchor="middle">〔不接〕 → no send</text>
    <text x="48" y="970" font-size="19" fill="#56677E" font-weight="400" >Local rules keep the boundaries; the model sees context before choosing.</text>
  </g>
</svg>
