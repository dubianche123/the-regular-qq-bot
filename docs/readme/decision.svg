<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="img" aria-labelledby="decisions-title decisions-desc" xml:lang="en">
<title id="decisions-title">What Decisions actually receives</title><desc id="decisions-desc">A synthetic teacup exchange shows the main triage request. Local code selects and anonymizes the excerpt, then sends model, input and questions. Input is a JSON string; questions contain instructions and fixed choices with descriptions. Local code filters returned choices and scores and handles routing. Fields are conditional; the chat persona and daily memory are not attached automatically.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, &apos;PingFang SC&apos;, &apos;Microsoft YaHei&apos;, sans-serif">
<rect x="1" y="1" width="1278" height="1278" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
<text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700">THE REGULAR / DECISIONS INPUT</text>
<text x="48" y="98" font-size="32" fill="#213249" font-weight="700">What Decisions actually receives</text>
<text x="48" y="137" font-size="21" fill="#56677E" font-weight="400">One shared scene + relevant choice questions. Code handles the result.</text>
<rect x="48" y="174" width="1184" height="126" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<text x="72" y="204" font-size="15" fill="#A7783E" font-weight="700" data-box="48,174,1232,300">SYNTHETIC EXAMPLE · a follow-up, not an @ mention</text>
<text x="72" y="237" font-size="21" fill="#213249" font-weight="500" data-box="48,174,1232,300">member_a: “What is this thing?”  →  Atuan: “I’m not sure what this is.”</text>
<text x="72" y="273" font-size="22" fill="#213249" font-weight="650" data-box="48,174,1232,300">Now member_a says: “Atuan, I think it looks like a teacup.”</text>
<path d="M640 308v24" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="342" width="1184" height="68" rx="14" fill="#FFF4E4" stroke="#E6D6BE"/>
<text x="72" y="370" font-size="15" fill="#A7783E" font-weight="700" data-box="48,342,1232,410">01 / LOCAL CODE</text>
<text x="278" y="370" font-size="19" fill="#213249" font-weight="500" data-box="48,342,1232,410">Select the excerpt, map identities to member_a, and choose the questions.</text>
<text x="278" y="395" font-size="17" fill="#56677E" font-weight="400" data-box="48,342,1232,410">At most four earlier human lines; include a delivered bot reply only within its window.</text>
<path d="M640 418v24" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="452" width="1184" height="466" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="48" y="452" width="1184" height="60" rx="18" fill="#213249" stroke="#213249"/>
<text x="72" y="490" font-size="16" fill="#FFFFFF" font-weight="700">02 / ONE NATIVE REQUEST</text>
<text x="566" y="490" font-size="23" fill="#FFFFFF" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{ model, input, questions }</text>
<text x="72" y="541" font-size="18" fill="#56677E" font-weight="500">model: the configured judgment model</text>
<text x="740" y="541" font-size="18" fill="#56677E" font-weight="400">Ask several relevant questions together.</text>
<rect x="72" y="562" width="560" height="328" rx="14" fill="#EAF0F6" stroke="#D5DFEB"/>
<rect x="656" y="562" width="552" height="328" rx="14" fill="#EAF4EF" stroke="#BCD5CA"/>
<text x="94" y="596" font-size="23" fill="#5375A1" font-weight="700" data-box="72,562,632,890">input · the scene</text>
<text x="94" y="623" font-size="16" fill="#56677E" font-weight="400" data-box="72,562,632,890">JSON string on the wire; decoded here for reading.</text>
<text x="94" y="658" font-size="17" fill="#5375A1" font-weight="600" data-box="72,562,632,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">recent_human_messages</text>
<text x="94" y="714" font-size="17" fill="#5375A1" font-weight="600" data-box="72,562,632,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bot_reply</text>
<text x="94" y="770" font-size="17" fill="#5375A1" font-weight="600" data-box="72,562,632,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">latest_message</text>
<text x="112" y="683" font-size="18" fill="#213249" font-weight="400" data-box="72,562,632,890">member_a: “What is this thing?”</text>
<text x="112" y="739" font-size="18" fill="#213249" font-weight="400" data-box="72,562,632,890">“I’m not sure what this is.” · last delivered reply</text>
<text x="112" y="795" font-size="18" fill="#213249" font-weight="400" data-box="72,562,632,890">member_a: “Atuan, I think it’s a teacup.”</text>
<text x="94" y="829" font-size="17" fill="#5375A1" font-weight="500" data-box="72,562,632,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">latest_is_directed: true</text>
<text x="94" y="860" font-size="17" fill="#5375A1" font-weight="500" data-box="72,562,632,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">bot_is_addressed_as: [&quot;Atuan&quot;]</text>
<text x="678" y="596" font-size="23" fill="#397D70" font-weight="700" data-box="656,562,1208,890">questions · how it is asked</text>
<text x="678" y="623" font-size="16" fill="#56677E" font-weight="400" data-box="656,562,1208,890">One question shown; wording below is illustrative.</text>
<text x="678" y="658" font-size="17" fill="#397D70" font-weight="600" data-box="656,562,1208,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">type: &quot;choice&quot; · name: &quot;addressed&quot;</text>
<text x="678" y="693" font-size="17" fill="#397D70" font-weight="600" data-box="656,562,1208,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">instructions</text>
<text x="696" y="720" font-size="18" fill="#213249" font-weight="400" data-box="656,562,1208,890">Does this continue the exchange and invite a reply?</text>
<text x="678" y="756" font-size="17" fill="#397D70" font-weight="600" data-box="656,562,1208,890" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">choices: [{ value, description }, …]</text>
<text x="696" y="786" font-size="18" fill="#213249" font-weight="400" data-box="656,562,1208,890">answer  → expects a response</text>
<text x="696" y="818" font-size="18" fill="#213249" font-weight="400" data-box="656,562,1208,890">quip  → a short reaction is welcome</text>
<text x="696" y="850" font-size="18" fill="#213249" font-weight="400" data-box="656,562,1208,890">let_it_pass  → no need to join in</text>
<text x="72" y="909" font-size="16" fill="#56677E" font-weight="400">Optional: messages after the bot reply / a proposed nickname.</text>
<path d="M640 926v24" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="960" width="560" height="158" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="672" y="960" width="560" height="158" rx="17" fill="#F0EBF8" stroke="#D6CCE7"/>
<text x="72" y="991" font-size="16" fill="#397D70" font-weight="700" data-box="48,960,608,1118">03 / SERVICE RETURNS</text>
<text x="72" y="1026" font-size="19" fill="#213249" font-weight="500" data-box="48,960,608,1118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">answers: [{ name: &quot;addressed&quot;,</text>
<text x="92" y="1056" font-size="19" fill="#397D70" font-weight="600" data-box="48,960,608,1118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">choice: &quot;answer&quot;, … }]</text>
<text x="72" y="1094" font-size="17" fill="#56677E" font-weight="400" data-box="48,960,608,1118">Plus confidence / probabilities; not a group reply.</text>
<path d="M616 1040h48" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="696" y="991" font-size="16" fill="#7962A7" font-weight="700" data-box="672,960,1232,1118">04 / LOCAL CODE DECIDES</text>
<text x="696" y="1026" font-size="21" fill="#213249" font-weight="650" data-box="672,960,1232,1118">usable_choices → accept or fall back</text>
<text x="696" y="1059" font-size="18" fill="#56677E" font-weight="400" data-box="672,960,1232,1118">Check missing fields, margins and feedback state.</text>
<text x="696" y="1092" font-size="18" fill="#56677E" font-weight="400" data-box="672,960,1232,1118">Then answer, quip, or let the reply model decide.</text>
<text x="48" y="1161" font-size="16" fill="#A7783E" font-weight="700">WHAT CAN BE ITERATED</text>
<rect x="48" y="1176" width="352" height="61" rx="12" fill="#FFFFFF" stroke="#D7E0EB"/>
<text x="66" y="1200" font-size="17" fill="#5375A1" font-weight="600" data-box="48,1176,400,1237" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">decisions.py</text>
<text x="66" y="1224" font-size="16" fill="#56677E" font-weight="400" data-box="48,1176,400,1237">Input selection and shape</text>
<rect x="464" y="1176" width="352" height="61" rx="12" fill="#FFFFFF" stroke="#D7E0EB"/>
<text x="482" y="1200" font-size="17" fill="#5375A1" font-weight="600" data-box="464,1176,816,1237" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">decision_prompts.py</text>
<text x="482" y="1224" font-size="16" fill="#56677E" font-weight="400" data-box="464,1176,816,1237">Wording, examples, option descriptions</text>
<rect x="880" y="1176" width="352" height="61" rx="12" fill="#FFFFFF" stroke="#D7E0EB"/>
<text x="898" y="1200" font-size="17" fill="#5375A1" font-weight="600" data-box="880,1176,1232,1237" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">usable_choices + callers</text>
<text x="898" y="1224" font-size="16" fill="#56677E" font-weight="400" data-box="880,1176,1232,1237">Filtering, routing and state handling</text>
<text x="48" y="1263" font-size="17" fill="#56677E" font-weight="400">No automatic chat persona or daily memory is attached; identity IDs are scrubbed locally.</text>
</g></svg>
