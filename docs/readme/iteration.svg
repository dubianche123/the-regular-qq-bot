<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="iteration-title iteration-desc" xml:lang="en">
<title id="iteration-title">Turn one incident into a lasting regression case</title><desc id="iteration-desc">Record the scene, check for suspicious behavior, let a coding agent diagnose and propose changes, save a regression case, compare old and new versions in independent replays, and let a maintainer decide what ships. Base and cand select code; directory selects real configuration and data.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1278" height="938" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
<text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1.7">THE REGULAR / SELF-ITERATION</text>
<text x="48" y="98" font-size="32" fill="#213249" font-weight="700" >Turn one incident into a lasting regression case</text>
<text x="48" y="137" font-size="20" fill="#56677E" font-weight="400" >Fixed commands replay evidence; a coding agent proposes fixes; a person decides what ships.</text>
<rect x="48" y="184" width="352" height="172" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="68" y="204" width="42" height="30" rx="9" fill="#EAF0F6"/>
<text x="89" y="225" font-size="16" fill="#5375A1" font-weight="700" text-anchor="middle">01</text>
<text x="124" y="224" font-size="14" fill="#5375A1" font-weight="650" >LIVE · AUTOMATIC</text>
<text x="70" y="269" font-size="23" fill="#213249" font-weight="700" >Keep the original scene</text>
<text x="70" y="305" font-size="18" fill="#56677E" font-weight="400" >Inputs · history · raw output</text>
<text x="70" y="335" font-size="18" fill="#56677E" font-weight="400" >Skip private chats · retain 30 days</text>
<rect x="464" y="184" width="352" height="172" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="484" y="204" width="42" height="30" rx="9" fill="#EAF4EF"/>
<text x="505" y="225" font-size="16" fill="#397D70" font-weight="700" text-anchor="middle">02</text>
<text x="540" y="224" font-size="14" fill="#397D70" font-weight="650" >COMMAND · READ-ONLY</text>
<text x="486" y="269" font-size="23" fill="#213249" font-weight="700" >Find, then verify</text>
<text x="486" y="305" font-size="18" fill="#56677E" font-weight="400" >checkup → context and findings</text>
<text x="486" y="335" font-size="18" fill="#56677E" font-weight="400" >A judge model labels candidates</text>
<rect x="880" y="184" width="352" height="172" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="900" y="204" width="42" height="30" rx="9" fill="#F0EBF8"/>
<text x="921" y="225" font-size="16" fill="#7962A7" font-weight="700" text-anchor="middle">03</text>
<text x="956" y="224" font-size="14" fill="#7962A7" font-weight="650" >CODING AGENT · EDITS</text>
<text x="902" y="269" font-size="23" fill="#213249" font-weight="700" >Find the cause</text>
<text x="902" y="305" font-size="18" fill="#56677E" font-weight="400" >Code issue or prompt issue?</text>
<text x="902" y="335" font-size="18" fill="#56677E" font-weight="400" >General fix + group-specific fix</text>
<rect x="880" y="422" width="352" height="172" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="900" y="442" width="42" height="30" rx="9" fill="#EAF0F6"/>
<text x="921" y="463" font-size="16" fill="#5375A1" font-weight="700" text-anchor="middle">04</text>
<text x="956" y="462" font-size="14" fill="#5375A1" font-weight="650" >CASE LIBRARY · CHECKS</text>
<text x="902" y="507" font-size="23" fill="#213249" font-weight="700" >Save a regression case</text>
<text x="902" y="543" font-size="18" fill="#56677E" font-weight="400" >Generation / triage / message</text>
<text x="902" y="573" font-size="18" fill="#56677E" font-weight="400" >State the intended behavior</text>
<rect x="464" y="422" width="352" height="172" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="484" y="442" width="42" height="30" rx="9" fill="#EAF4EF"/>
<text x="505" y="463" font-size="16" fill="#397D70" font-weight="700" text-anchor="middle">05</text>
<text x="540" y="462" font-size="14" fill="#397D70" font-weight="650" >COMMAND · EXECUTION</text>
<text x="486" y="507" font-size="23" fill="#213249" font-weight="700" >Compare old and new</text>
<text x="486" y="543" font-size="18" fill="#56677E" font-weight="400" >Checks + shuffled pairwise judging</text>
<text x="486" y="573" font-size="18" fill="#56677E" font-weight="400" >Full cases · day replay · ablation</text>
<rect x="48" y="422" width="352" height="172" rx="17" fill="#FFFFFF" stroke="#D7E0EB"/>
<rect x="68" y="442" width="42" height="30" rx="9" fill="#FFF4E4"/>
<text x="89" y="463" font-size="16" fill="#A7783E" font-weight="700" text-anchor="middle">06</text>
<text x="124" y="462" font-size="14" fill="#A7783E" font-weight="650" >MAINTAINER · RELEASE</text>
<text x="70" y="507" font-size="23" fill="#213249" font-weight="700" >A person decides to ship</text>
<text x="70" y="543" font-size="18" fill="#56677E" font-weight="400" >Read the report and its limits</text>
<text x="70" y="573" font-size="18" fill="#56677E" font-weight="400" >Deploy, check startup, observe</text>
<path d="M408 270h48" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M824 270h48" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1056 364v50" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M872 508h-48" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M456 508h-48" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M224 602v40H24V270h16" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="5 6"/>
<text x="270" y="648" font-size="18" fill="#56677E" font-weight="400" >New feedback after a human-approved release starts the next round</text>
<rect x="48" y="690" width="576" height="166" rx="17" fill="#EAF0F6" stroke="#D5DFEB"/>
<text x="72" y="729" font-size="23" fill="#213249" font-weight="650" >Source checkout</text>
<text x="72" y="774" font-size="21" fill="#5375A1" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--base HEAD / --cand .</text>
<text x="72" y="819" font-size="20" fill="#56677E" font-weight="400" >Code, prompt rules and seed cases</text>
<rect x="656" y="690" width="576" height="166" rx="17" fill="#EAF0F6" stroke="#D5DFEB"/>
<text x="680" y="729" font-size="23" fill="#213249" font-weight="650" >Deployment directory</text>
<text x="680" y="774" font-size="21" fill="#5375A1" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">--directory &quot;$DEPLOY&quot;</text>
<text x="680" y="819" font-size="20" fill="#56677E" font-weight="400" >.env + data/turns · cases · evals</text>
<text x="48" y="905" font-size="18" fill="#56677E" font-weight="400" >Evaluation requires --allow-paid. Ablation supplies evidence; a person always decides what ships.</text>
</g></svg>
