<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1180" viewBox="0 0 1280 1180" role="img" aria-labelledby="architecture-title architecture-desc" xml:lang="en">
<title id="architecture-title">Four stages, with code in control</title><desc id="architecture-desc">Intake, optional judgments, generation and local execution. Relevant group messages may use Decisions. Unaddressed messages can be passed to the reply model, which may stay quiet. Slow work has a 6-second inline wait. A four-layer prompt feeds the reply model, which proposes tags. Code parses, checks and delivers, and exclusively maintains local state.</desc>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
<rect x="1" y="1" width="1278" height="1178" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
<text x="48" y="48" font-size="16" fill="#A7783E" font-weight="700" letter-spacing="1.7">THE REGULAR / MESSAGE PATH</text>
<text x="48" y="98" font-size="32" fill="#213249" font-weight="700">Four stages, with code in control</text>
<text x="48" y="137" font-size="21" fill="#56677E" font-weight="400">Judgments and lookups are conditional. State stays local.</text>
<rect x="48" y="176" width="1184" height="130" rx="16" fill="white" stroke="#D7E0EB"/>
<rect x="72" y="200" width="44" height="36" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
<text x="94" y="225" font-size="18" fill="#A7783E" font-weight="700" text-anchor="middle">01</text>
<text x="72" y="271" font-size="24" fill="#213249" font-weight="700">Intake</text>
<rect x="270" y="200" width="300" height="82" rx="12" fill="#EAF0F6" stroke="#EAF0F6"/>
<text x="292" y="233" font-size="23" fill="#213249" font-weight="650">QQ group / private chat</text>
<text x="292" y="263" font-size="19" fill="#56677E" font-weight="400">Text · images · voice</text>
<path d="M578 241h44" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="648" y="233" font-size="22" fill="#213249" font-weight="600">Dedupe · turn @ into names</text>
<text x="648" y="265" font-size="20" fill="#56677E" font-weight="400">Transcribe voice · archive original messages</text>
<path d="M640 312v32" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="352" width="1184" height="198" rx="16" fill="white" stroke="#D7E0EB"/>
<rect x="72" y="376" width="44" height="36" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
<text x="94" y="401" font-size="18" fill="#A7783E" font-weight="700" text-anchor="middle">02</text>
<text x="72" y="447" font-size="24" fill="#213249" font-weight="700">Judgment</text>
<text x="72" y="478" font-size="17" fill="#56677E" font-weight="400">Choose a path</text>
<rect x="270" y="376" width="420" height="150" rx="12" fill="#EAF4EF" stroke="#C9DFD5"/>
<text x="292" y="408" font-size="19" fill="#397D70" font-weight="600">Relevant group messages</text>
<text x="292" y="446" font-size="23" fill="#213249" font-weight="650">Decisions closed-set triage</text>
<text x="292" y="480" font-size="19" fill="#56677E" font-weight="400">As needed: one call, several questions</text>
<text x="292" y="510" font-size="19" fill="#56677E" font-weight="400">Code applies choices or falls back</text>
<rect x="738" y="376" width="466" height="150" rx="12" fill="#F0EBF8" stroke="#DBD1EB"/>
<text x="760" y="408" font-size="19" fill="#7962A7" font-weight="600">Messages that do not call the bot</text>
<text x="760" y="446" font-size="23" fill="#213249" font-weight="650">Let the reply model decide</text>
<text x="760" y="480" font-size="19" fill="#56677E" font-weight="400">Reply or stay quiet; local rules still apply</text>
<text x="760" y="510" font-size="19" fill="#56677E" font-weight="400">Quiet windows · stop requests · queue</text>
<path d="M640 556v32" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="596" width="1184" height="180" rx="16" fill="white" stroke="#D7E0EB"/>
<rect x="72" y="620" width="44" height="36" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
<text x="94" y="645" font-size="18" fill="#A7783E" font-weight="700" text-anchor="middle">03</text>
<text x="72" y="691" font-size="24" fill="#213249" font-weight="700">Generate</text>
<text x="72" y="722" font-size="17" fill="#56677E" font-weight="400">Prepare &amp; call</text>
<rect x="270" y="620" width="252" height="132" rx="12" fill="#F0EBF8" stroke="#DBD1EB"/>
<rect x="558" y="620" width="252" height="132" rx="12" fill="#F0EBF8" stroke="#DBD1EB"/>
<rect x="846" y="620" width="358" height="132" rx="12" fill="#F0EBF8" stroke="#DBD1EB"/>
<text x="290" y="654" font-size="21" fill="#213249" font-weight="650">Slow work / images</text>
<text x="290" y="690" font-size="19" fill="#56677E" font-weight="400">After 6 s: send a</text>
<text x="290" y="719" font-size="19" fill="#56677E" font-weight="400">holding line first</text>
<path d="M528 686h22" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="578" y="654" font-size="21" fill="#213249" font-weight="650">Four-layer prompt</text>
<text x="578" y="690" font-size="18" fill="#56677E" font-weight="400">Stable head · memory</text>
<text x="578" y="719" font-size="18" fill="#56677E" font-weight="400">Session · current turn</text>
<path d="M816 686h22" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="868" y="654" font-size="23" fill="#213249" font-weight="650">Reply model</text>
<text x="868" y="690" font-size="20" fill="#56677E" font-weight="400">What to say, whether to act</text>
<text x="868" y="719" font-size="19" fill="#56677E" font-weight="400">Text · 〔不接〕 · action intent</text>
<path d="M640 782v32" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="48" y="822" width="1184" height="170" rx="16" fill="white" stroke="#D7E0EB"/>
<rect x="72" y="846" width="44" height="36" rx="10" fill="#FFF4E4" stroke="#FFF4E4"/>
<text x="94" y="871" font-size="18" fill="#A7783E" font-weight="700" text-anchor="middle">04</text>
<text x="72" y="917" font-size="24" fill="#213249" font-weight="700">Execute</text>
<text x="72" y="948" font-size="17" fill="#56677E" font-weight="400">Local code</text>
<rect x="270" y="846" width="350" height="122" rx="12" fill="#FFF4E4" stroke="#E6D6BE"/>
<text x="292" y="879" font-size="22" fill="#213249" font-weight="650">Parse reply tags</text>
<text x="292" y="913" font-size="19" fill="#56677E" font-weight="400">〔画〕 draw · 〔语音〕 voice</text>
<text x="292" y="943" font-size="19" fill="#56677E" font-weight="400">〔不接〕 pass · 〔提醒〕 remind</text>
<path d="M626 907h22" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="656" y="846" width="270" height="122" rx="12" fill="#FFF4E4" stroke="#E6D6BE"/>
<text x="678" y="879" font-size="22" fill="#213249" font-weight="650">Check &amp; deliver</text>
<text x="678" y="913" font-size="19" fill="#56677E" font-weight="400">Quotas · moderation</text>
<text x="678" y="943" font-size="19" fill="#56677E" font-weight="400">Record actual outcomes</text>
<path d="M932 907h22" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="962" y="846" width="242" height="122" rx="12" fill="#FFF4E4" stroke="#E6D6BE"/>
<text x="984" y="879" font-size="22" fill="#213249" font-weight="650">Outputs</text>
<text x="984" y="913" font-size="20" fill="#56677E" font-weight="400">Text · image</text>
<text x="984" y="943" font-size="20" fill="#56677E" font-weight="400">Voice · reminder</text>
<rect x="48" y="1038" width="1184" height="104" rx="16" fill="#EAF0F6" stroke="#D5DFEB"/>
<text x="72" y="1078" font-size="24" fill="#213249" font-weight="700">Local state</text>
<text x="72" y="1114" font-size="19" fill="#56677E" font-weight="400">Owned by code</text>
<text x="348" y="1078" font-size="21" fill="#213249" font-weight="600">Relationships · names · memory · ledgers · quotas · jobs</text>
<text x="348" y="1114" font-size="20" fill="#56677E" font-weight="400">Code reads context and quotas, then writes actual results.</text>
</g></svg>
