<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="diagram-title diagram-desc" xml:lang="zh-CN">
  <title id="diagram-title">慢的事，先回应，再跟进</title>
  <desc id="diagram-desc">代码启动任务取得把手，六秒内完成就带结果回答；未完成则先发本地等待句，把手落盘，由定时任务有界轮询，重启后可继续。成功后模型带结果生成跟进，失败或超时由本地短句交代。依次尝试原消息被动回复、主动发言、下一条群消息捎带。</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1l6 3-6 3" fill="none" stroke="#8290A3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="1" y="1" width="1278" height="1078" rx="24" fill="#F6F8FC" stroke="#D7E0EB"/>
    <text x="48" y="50" font-size="16" font-weight="700" fill="#A7783E" letter-spacing="1.7">THE REGULAR / SLOW WORK</text>
    <text x="48" y="102" font-size="32" font-weight="700" fill="#213249" >慢的事，先回应，再跟进</text>
    <text x="48" y="142" font-size="21" font-weight="400" fill="#56677E" >用可落盘的任务把手，把等待、恢复和投递交给本地代码。</text>
    <rect x="48" y="184" width="1184" height="80" rx="17" fill="#213249" stroke="#213249"/>
    <text x="72" y="218" font-size="21" font-weight="700" fill="#EDC792" >start → 把手</text>
    <text x="72" y="247" font-size="18" font-weight="400" fill="#D4DFEB" >代码起一项任务</text>
    <path d="M385 204v40" stroke="#54647A"/>
    <text x="420" y="229" font-size="21" font-weight="500" fill="#FFFFFF" >在线上最多等 6 秒，看结果是否已经回来 · ASYNC_REPLY_SECONDS</text>
    <path d="M328 264v42" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M952 264v42" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="48" y="318" width="560" height="176" rx="18" fill="#EAF4EF" stroke="#D7E0EB"/>
    <text x="72" y="350" font-size="16" font-weight="700" fill="#397D70" >A / 6 秒内完成</text>
    <text x="72" y="390" font-size="24" font-weight="650" fill="#213249" >带着资料，正常答一条</text>
    <text x="72" y="429" font-size="20" font-weight="400" fill="#56677E" >结果进入本轮上下文</text>
    <text x="72" y="461" font-size="20" font-weight="400" fill="#56677E" >直接生成正式回答，本轮结束</text>
    <rect x="672" y="318" width="560" height="176" rx="18" fill="#FFF4E4" stroke="#D7E0EB"/>
    <text x="696" y="350" font-size="16" font-weight="700" fill="#A7783E" >B / 还没有完成</text>
    <text x="696" y="390" font-size="24" font-weight="650" fill="#213249" >先回一句，把手落盘</text>
    <text x="696" y="429" font-size="20" font-weight="400" fill="#56677E" >「我去查查，等我一会儿。」</text>
    <text x="696" y="461" font-size="20" font-weight="400" fill="#56677E" >把手交给定时任务表，随状态落盘</text>
    <path d="M952 494v42" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="48" y="548" width="1184" height="158" rx="18" fill="#FFFFFF" stroke="#D7E0EB"/>
    <text x="72" y="582" font-size="16" font-weight="700" fill="#A7783E" letter-spacing="1">本地定时任务 · 有界轮询</text>
    <text x="72" y="625" font-size="21" font-weight="650" fill="#213249" >重启后照着把手续查</text>
    <text x="72" y="667" font-size="19" font-weight="400" fill="#56677E" >任务把手落盘，bot 重启也不丢</text>
    <text x="488" y="625" font-size="21" font-weight="650" fill="#213249" >代码定时查询任务状态</text>
    <text x="488" y="667" font-size="19" font-weight="400" fill="#56677E" >按 poll_every 轮询，到上限就停止</text>
    <text x="904" y="625" font-size="21" font-weight="650" fill="#213249" >完成后再写正式跟进</text>
    <text x="904" y="667" font-size="19" font-weight="400" fill="#56677E" >回复模型带着结果，组织跟进那句</text>
    <path d="M406 630h50" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M822 630h50" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <rect x="48" y="730" width="1184" height="54" rx="13" fill="#FFF4E4" stroke="#E6D6BE"/>
    <text x="72" y="765" font-size="19" font-weight="400" fill="#56677E" >失败或超过上限 → 本地补一句「这次没查成」，不另花一次生成，也不把人晾着。</text>
    <text x="48" y="831" font-size="16" font-weight="700" fill="#A7783E" letter-spacing="1.1">结果回来后，依次尝试投递</text>
    <rect x="48" y="852" width="352" height="156" rx="18" fill="#FFF4E4" stroke="#D7E0EB"/>
    <text x="72" y="884" font-size="16" font-weight="700" fill="#A7783E" >01 / 被动回复窗口内</text>
    <text x="72" y="924" font-size="24" font-weight="650" fill="#213249" >回原消息的第二句</text>
    <text x="72" y="963" font-size="20" font-weight="400" fill="#56677E" >同一条消息，msg_seq=2</text>
    <rect x="464" y="852" width="352" height="156" rx="18" fill="#FFF4E4" stroke="#D7E0EB"/>
    <text x="488" y="884" font-size="16" font-weight="700" fill="#A7783E" >02 / 被动窗口已过</text>
    <text x="488" y="924" font-size="24" font-weight="650" fill="#213249" >尝试一次主动发言</text>
    <text x="488" y="963" font-size="20" font-weight="400" fill="#56677E" >QQ 被动回复窗口过期时使用</text>
    <rect x="880" y="852" width="352" height="156" rx="18" fill="#FFF4E4" stroke="#D7E0EB"/>
    <text x="904" y="884" font-size="16" font-weight="700" fill="#A7783E" >03 / 主动发言也被拒</text>
    <text x="904" y="924" font-size="24" font-weight="650" fill="#213249" >捎在群里下一条消息上</text>
    <text x="904" y="963" font-size="20" font-weight="400" fill="#56677E" >保留写好的跟进内容</text>
    <text x="904" y="995" font-size="20" font-weight="400" fill="#56677E" >最多等一天</text>
    <path d="M406 935h50" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M822 935h50" fill="none" stroke="#8290A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="48" y="1047" font-size="19" font-weight="400" fill="#56677E" >轮询只检查已登记任务的状态；等待提示、失败提示均为本地短句。</text>
  </g>
</svg>
