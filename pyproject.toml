[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "the-regular"
description = "A QQ group companion you can improve with your coding agent and group feedback"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/dubianche123/the-regular-qq-bot"
Repository = "https://github.com/dubianche123/the-regular-qq-bot"
Issues = "https://github.com/dubianche123/the-regular-qq-bot/issues"

[project.scripts]
regular = "regular.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2"]
desktop = ["PySide6-Essentials>=6.10,<7", "sounddevice>=0.5,<1", "pywebrtc-audio==0.2.0", "numpy>=1.26,<3", "pyobjc-framework-AVFoundation>=11,<13; sys_platform == 'darwin'"]
desktop-build = ["PySide6-Essentials>=6.10,<7", "sounddevice>=0.5,<1", "pywebrtc-audio==0.2.0", "numpy>=1.26,<3", "pyobjc-framework-AVFoundation>=11,<13; sys_platform == 'darwin'", "PyInstaller>=6.22,<7", "Pillow>=11,<13"]

[tool.setuptools]
packages = ["regular", "regular.assets", "regular.assets.pet"]
py-modules = ["activation", "affinity", "archive", "bot", "config", "digest", "knowledge", "naming", "nicking", "panel", "proactive", "prompts", "providers", "qqtext", "quotes", "recall", "relations", "reminders", "runtime", "search", "storage", "turns", "wordfilter", "delivery", "media", "health", "interactions", "receptive", "scheduler", "slowwork", "image_generation", "expression", "voice_input", "voice_event", "voice_runtime", "voice_amr", "realtime_synth", "voice_budget", "voice_outbound", "voice_output_runtime"]

[tool.setuptools.dynamic]
version = {attr = "regular.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
regular = ["voice_amr.mjs", "voice_encode.mjs", "panel.css", "panel.js", "assets/*.png", "assets/*.json", "assets/pet/*.webp", "assets/pet/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
